# SKILLS Design

## Rôle

SKILLS est le **registre unique** des skills de l'écosystème :
- Foundational skills (cross-cutting)
- Domain skills (métier)
- External skills (assimilées)

## Flux inter-dépôts

Ce dépôt est **provider** de l'atome `skill-orchestration` et **consumer** de `primitive-flow` :
- `skill-orchestration` : SKILLS → CTULU, PRIMUS, Kilo Agent
- `primitive-flow` : PRIMUS → SKILLS (consumer)

## Relations

| Repo | Relation | Type |
|---|---|---|
| CTULU | Consumer | skill-orchestration |
| PRIMUS | Provider | primitive-flow |
| Kilo Agent | Consumer | skill-orchestration |

## Contraintes

- Tous les skills DOIVENT avoir un `trit_primitive` dans le frontmatter
- Le `REGISTRY.yaml` est la source de vérité
- Les skills externes DOIVENT être versionnés

