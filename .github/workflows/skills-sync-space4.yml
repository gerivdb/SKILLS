name: Sync Skills to GOVERNANCE-HUB Space-4

on:
  push:
    branches: [main]
    paths:
      - 'perplexity/skills/*.md'
  workflow_dispatch:

jobs:
  sync-skills:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout SKILLS repo
        uses: actions/checkout@v4
        with:
          path: skills-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate skills section
        id: generate
        run: |
          python3 << 'PYEOF'
          import os, sys
          from pathlib import Path

          skills_dir = Path("skills-repo/perplexity/skills")
          if not skills_dir.exists():
              print("No perplexity/skills/ directory found")
              sys.exit(0)

          skill_files = sorted(skills_dir.glob("*.md"))
          total = len(skill_files)

          lines = []
          lines.append(f"## Skills ({total} total — synced from gerivdb/SKILLS)")
          lines.append("")
          lines.append("| # | Skill | Description |")
          lines.append("|---|-------|-------------|")

          for i, sf in enumerate(skill_files, 1):
              name = sf.stem
              # Try to extract first heading as description
              desc = ""
              try:
                  content = sf.read_text(encoding="utf-8", errors="replace")
                  for line in content.splitlines():
                      line = line.strip()
                      if line.startswith("# "):
                          desc = line[2:].strip()
                          break
              except Exception:
                  pass
              if not desc:
                  desc = name.replace("-", " ").title()
              lines.append(f"| {i} | `{name}` | {desc} |")

          output = "\n".join(lines) + "\n"

          # Write to a temp file
          Path("/tmp/skills_section.md").write_text(output, encoding="utf-8")
          print(f"Generated section with {total} skills")
          print(f"::set-output name=skill_count::{total}")
          PYEOF

      - name: Checkout GOVERNANCE-HUB
        uses: actions/checkout@v4
        with:
          repository: gerivdb/GOVERNANCE-HUB
          token: ${{ secrets.GH_PAT }}
          path: governance-hub

      - name: Update space-4 instructions
        if: steps.generate.outputs.skill_count
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path

          target = Path("governance-hub/spaces/space-4-DEV_COMET-instructions.md")
          if not target.exists():
              print(f"ERROR: {target} not found")
              exit(1)

          content = target.read_text(encoding="utf-8")
          new_section = Path("/tmp/skills_section.md").read_text(encoding="utf-8")

          # Replace existing skills section (## Skills ... until next ## or ---)
          pattern = r'## Skills \(.*?\n(.*?)(?=\n## |\n--- |\Z)'
          replacement = new_section.rstrip() + "\n"

          new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)

          # If no match, insert after the metadata table
          if new_content == content:
              # Insert after the last line of the metadata table
              lines = content.split("\n")
              insert_idx = 0
              for i, line in enumerate(lines):
                  if line.strip().startswith("| Dernière vérification"):
                      insert_idx = i + 1
                      break
              if insert_idx:
                  lines.insert(insert_idx, "")
                  lines.insert(insert_idx + 1, new_section.rstrip())
                  new_content = "\n".join(lines) + "\n"
              else:
                  # Fallback: append before the SUPERSTRUCTURE section
                  new_content = content.rstrip() + "\n\n" + new_section

          target.write_text(new_content, encoding="utf-8")
          print(f"Updated {target}")
          PYEOF

      - name: Create Pull Request
        if: steps.generate.outputs.skill_count
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          path: governance-hub
          commit-message: "chore(space-4): auto-sync skills from SKILLS repo"
          title: "chore(space-4): Auto-sync skills from SKILLS repo"
          body: |
            This PR auto-updates `spaces/space-4-DEV_COMET-instructions.md` with the latest skills from `gerivdb/SKILLS/perplexity/skills/`.

            **Trigger:** Push to `main` in `gerivdb/SKILLS` that modified `perplexity/skills/*.md`

            **Changes:**
            - Updated skills count and listing in Space 4 instructions

            <!-- Auto-generated by SKILLS sync workflow -->
          branch: chore/space-4-skills-sync
          delete-branch: true
          base: main
