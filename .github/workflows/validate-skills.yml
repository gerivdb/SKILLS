name: Validate Skills

on:
  push:
    branches: [main]
    paths:
      - 'perplexity/**/*.md'
      - 'MANIFEST.json'
  pull_request:
    paths:
      - 'perplexity/**/*.md'
      - 'MANIFEST.json'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate Skill Format
        run: |
          python tools/validate-skills.py

      - name: Validate Agentic Skills
        run: |
          python tools/validate-agentic.py

      - name: Check Slot Count
        run: |
          python tools/check-slots.py --max 100

      - name: Report Results
        if: always()
        run: |
          echo "## Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "- Skill format: ${{ steps.validate.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Agentic validation: ${{ steps.validate-agentic.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Slot count: ${{ steps.check-slots.outcome }}" >> $GITHUB_STEP_SUMMARY
