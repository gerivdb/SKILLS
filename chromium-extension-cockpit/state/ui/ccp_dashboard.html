<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCP Cockpit — Dashboard Extensions Chromium</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --text: #f8fafc;
    --muted: #94a3b8;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --border: #334155;
    --radius: 8px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
  .badge--ok { background: rgba(34,197,94,0.15); color: var(--success); border: 1px solid rgba(34,197,94,0.35); }
  .badge--err { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.35); }
  .badge--warn { background: rgba(245,158,11,0.15); color: var(--warning); border: 1px solid rgba(245,158,11,0.35); }
  .badge--inactive { background: rgba(148,163,184,0.15); color: var(--muted); border: 1px solid rgba(148,163,184,0.35); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-bottom: 24px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .card-slug { font-size: 1.1rem; font-weight: 700; }
  .card-meta { display: flex; gap: 10px; font-size: 0.8rem; color: var(--muted); }
  .card-actions { display: flex; gap: 8px; margin-top: 12px; }
  button { border: none; border-radius: 6px; padding: 6px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  button.btn-primary { background: var(--accent); color: white; }
  button.btn-primary:hover { background: var(--accent-hover); }
  button.btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button.btn-outline:hover { background: rgba(255,255,255,0.05); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .section { margin-bottom: 24px; }
  .section-title { font-size: 0.9rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th { text-align: left; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 10px; border-bottom: 1px solid var(--border); color: var(--text); }
  tr:hover { background: rgba(255,255,255,0.03); }
  .empty { text-align: center; color: var(--muted); padding: 24px; }
  .status-chip { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot--ok { background: var(--success); box-shadow: 0 0 8px var(--success); }
  .dot--err { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  .dot--warn { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
  .dot--inactive { background: var(--muted); }
  .btn-sm { padding: 4px 8px; font-size: 0.75rem; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.75rem; }
  #status-bar { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--muted); margin-bottom: 16px; }
  #last-refresh { font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>CCP Cockpit — Dashboard Extensions</h1>
    <div id="status-bar">
      <span class="badge badge--ok" id="api-badge">Serveur : vérification...</span>
      <span id="last-refresh">—</span>
    </div>
  </header>

  <div class="section">
    <div class="section-title">Extensions</div>
    <div id="extensions-grid" class="grid">
      <div class="empty">Chargement des extensions…</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Télémétrie — Erreurs non résolues</div>
    <table id="telemetry-table">
      <thead>
        <tr>
          <th style="width: 16%">Heure</th>
          <th style="width: 20%">Extension</th>
          <th style="width: 10%">Niveau</th>
          <th>Message</th>
        </tr>
      </thead>
      <tbody id="telemetry-body">
        <tr><td colspan="4" class="empty">Chargement de la télémétrie…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const API_BASE = 'http://127.0.0.1:8796';
const REFRESH_MS = 5000;

async function fetchJSON(path) {
  const res = await fetch(`${API_BASE}${path}`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function badgeFor(status) {
  const s = (status || '').toLowerCase();
  if (s === 'active') return '<span class="badge badge--ok">Actif</span>';
  if (s === 'disabled') return '<span class="badge badge--inactive">Inactif</span>';
  return `<span class="badge badge--warn">${status}</span>`;
}

function renderExtensions(extensions) {
  const grid = document.getElementById('extensions-grid');
  if (!extensions || extensions.length === 0) {
    grid.innerHTML = '<div class="empty">Aucune extension enregistrée.</div>';
    return;
  }
  grid.innerHTML = extensions.map(ext => {
    const healthy = ext.healthy;
    const dotClass = healthy ? 'dot--ok' : 'dot--err';
    const dotText = healthy ? 'OK' : 'Erreurs';
    return `
      <div class="card">
        <div class="card-header">
          <div class="card-slug">${escapeHtml(ext.slug)}</div>
          <div class="status-chip">
            <span class="dot ${dotClass}"></span>
            <span>${dotText}</span>
          </div>
        </div>
        <div class="card-meta">
          <span>v${ext.version}</span>
          <span>• ${ext.git_repo || '—'}</span>
          <span>• ${ext.auto_reload ? 'Auto-reload' : 'Manuel'}</span>
        </div>
        <div style="margin: 10px 0; font-size: 0.8rem; color: var(--muted);">
          ${ext.error_count} erreur(s) totales • <strong style="color: ${ext.unresolved_errors > 0 ? 'var(--danger)' : 'var(--success)'}">${ext.unresolved_errors} non résolue(s)</strong>
        </div>
        <div class="card-actions">
          <button class="btn-primary btn-sm" onclick="reloadExt('${escapeHtml(ext.slug)}')">Recharger</button>
          <button class="btn-outline btn-sm" onclick="clearErrors('${escapeHtml(ext.slug)}')">Purger erreurs</button>
        </div>
      </div>
    `;
  }).join('');
}

function renderTelemetry(events) {
  const tbody = document.getElementById('telemetry-body');
  if (!events || events.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">Aucune erreur non résolue.</td></tr>';
    return;
  }
  tbody.innerHTML = events.map(ev => {
    const levelClass = ev.level === 'error' ? 'text-danger' : 'text-warning';
    return `
      <tr>
        <td><span class="mono">${ev.timestamp}</span></td>
        <td>${escapeHtml(ev.extension_slug || '—')}</td>
        <td><span class="badge ${ev.level === 'error' ? 'badge--err' : 'badge--warn'}">${ev.level}</span></td>
        <td><span class="mono">${escapeHtml(ev.message)}</span></td>
      </tr>
    `;
  }).join('');
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function loadExtensions() {
  try {
    const data = await fetchJSON('/api/extensions');
    renderExtensions(data.extensions);
  } catch (e) {
    document.getElementById('extensions-grid').innerHTML = `<div class="empty">Erreur : ${escapeHtml(e.message)}</div>`;
  }
}

async function loadTelemetry() {
  try {
    const data = await fetchJSON('/api/telemetry?limit=20');
    renderTelemetry(data.events);
  } catch (e) {
    document.getElementById('telemetry-body').innerHTML = `<tr><td colspan="4" class="empty">Erreur : ${escapeHtml(e.message)}</td></tr>`;
  }
}

async function reloadExt(slug) {
  const btn = event.currentTarget;
  const orig = btn.textContent;
  btn.textContent = '…';
  btn.disabled = true;
  try {
    await fetch(`${API_BASE}/api/reload?slug=${encodeURIComponent(slug)}`, { method: 'POST' });
    await loadExtensions();
  } catch (e) {
    alert('Erreur lors du rechargement : ' + e.message);
  } finally {
    btn.textContent = orig;
    btn.disabled = false;
  }
}

async function clearErrors(slug) {
  const btn = event.currentTarget;
  const orig = btn.textContent;
  btn.textContent = '…';
  btn.disabled = true;
  try {
    await fetch(`${API_BASE}/api/clear-errors?slug=${encodeURIComponent(slug)}`, { method: 'POST' });
    await loadExtensions();
    await loadTelemetry();
  } catch (e) {
    alert('Erreur lors de la purge : ' + e.message);
  } finally {
    btn.textContent = orig;
    btn.disabled = false;
  }
}

async function checkAPI() {
  try {
    const data = await fetchJSON('/api/health');
    document.getElementById('api-badge').className = 'badge badge--ok';
    document.getElementById('api-badge').textContent = 'Serveur : en ligne';
  } catch (e) {
    document.getElementById('api-badge').className = 'badge badge--err';
    document.getElementById('api-badge').textContent = 'Serveur : hors ligne';
  }
}

async function refresh() {
  await checkAPI();
  await loadExtensions();
  await loadTelemetry();
  const now = new Date().toLocaleTimeString();
  document.getElementById('last-refresh').textContent = `Dernière MAJ : ${now}`;
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
